# This is a Declarative Automation Bundle definition for northmart360.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: northmart360

variables:
  sql_warehouse_id:
    description: SQL Warehouse used by NorthMart jobs

include:
  - resource/*.yml

sync:
  include:
    - src/**
    - tests/**
    - northmart_dbt/**
  exclude:
    - terraform/**
    - .venv/**
    - .venv-dbt/**    
    - .git/**
    - src/source_generator/**
    - northmart_dbt/target/**
    - northmart_dbt/logs/**


targets:
  dev:
    mode: development
    default: true

    variables:
      sql_warehouse_id: "400d6525fd91fee7"
    workspace:
      host: https://adb-7405613337187597.17.azuredatabricks.net

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://adb-7405613337187597.17.azuredatabricks.net
