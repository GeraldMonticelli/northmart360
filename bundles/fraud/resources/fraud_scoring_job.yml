resources:
  jobs:
    fraud_scoring_job:
      name: northmart-fraud-scoring-${bundle.target}

      tasks:
        - task_key: score_fraud
          spark_python_task:
            python_file: ../src/ml/score_fraud_model.py
          job_cluster_key: fraud_scoring_cluster

      job_clusters:
        - job_cluster_key: fraud_scoring_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER

            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]

            custom_tags:
              ResourceClass: SingleNode