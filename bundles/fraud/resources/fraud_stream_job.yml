resources:
  jobs:
    fraud_stream_job:
      name: northmart-fraud-stream-${bundle.target}

      continuous:
        pause_status: PAUSED

      tasks:
        - task_key: ingest_fraud_events
          spark_python_task:
            python_file: ../src/ingestion/ingest_kafka.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--eventhub-namespace"
              - "${var.eventhub_namespace}"

          job_cluster_key: fraud_stream_cluster

      job_clusters:
        - job_cluster_key: fraud_stream_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER

            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]

            custom_tags:
              ResourceClass: SingleNode