resources:
  jobs:
    fraud_ml_job:
      name: northmart-fraud-ml-${bundle.target}

      tasks:
        - task_key: train_fraud_model

          spark_python_task:
            python_file: ../src/ml/train_fraud_model_2.py

          job_cluster_key: fraud_ml_cluster

          libraries:
            - pypi:
                package: databricks-feature-engineering

      job_clusters:
        - job_cluster_key: fraud_ml_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v3
            num_workers: 0
            data_security_mode: SINGLE_USER

            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]

            custom_tags:
              ResourceClass: SingleNode