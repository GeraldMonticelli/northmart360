services:

  fuseki:
    build:
      context: ../../runtime/fuseki
      dockerfile: Dockerfile.full
    image: northmart-fuseki-full
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki/databases
      - ../../runtime/fuseki/configuration:/fuseki/run/configuration
    restart: unless-stopped


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped


  ontouml-mcp:
    build:
      context: ../../services/ontouml-mcp
      dockerfile: Dockerfile
    image: ontouml-mcp
    ports:
      - "8001:8001"
    environment:
      FUSEKI_QUERY_URL: "http://fuseki:3030/ontouml"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX: "ontouml"
    depends_on:
      - fuseki
      - elasticsearch
    restart: unless-stopped


  cyfun-mcp:
    build:
      context: ../../services/cyfun-mcp
      dockerfile: Dockerfile
    image: cyfun-mcp
    ports:
      - "8002:8002"
    environment:
      FUSEKI_QUERY_URL: "http://fuseki:3030/cyfun"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX: "cyfun"
    depends_on:
      - fuseki
      - elasticsearch
    restart: unless-stopped


  ontouml-tunnel:
    image: ghcr.io/openai/tunnel-client:v0.0.15
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${ONTOUML_TUNNEL_ID}
    command:
      - run
      - --health.listen-addr
      - "0.0.0.0:8081"
      - --mcp.server-url
      - "http://ontouml-mcp:8001/ontouml-mcp"
    depends_on:
      - ontouml-mcp
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped


  cyfun-tunnel:
    image: ghcr.io/openai/tunnel-client:v0.0.15
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CYFUN_TUNNEL_ID}
    command:
      - run
      - --health.listen-addr
      - "0.0.0.0:8082"
      - --mcp.server-url
      - "http://cyfun-mcp:8002/cyfun-mcp"
    depends_on:
      - cyfun-mcp
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

volumes:
  fuseki-data:
  elasticsearch-data: