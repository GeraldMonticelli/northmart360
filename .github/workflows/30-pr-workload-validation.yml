name: Workload PR Validation

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Discover Databricks host
        id: databricks
        shell: bash
        run: |
          HOST=$(az databricks workspace show \
            --resource-group "$TF_VAR_resource_group_name" \
            --name "$TF_VAR_workspace_name" \
            --query "workspaceUrl" \
            --output tsv)

          if [ -n "$HOST" ]; then
            if [[ "$HOST" != https://* ]]; then
              HOST="https://$HOST"
            fi

            echo "host=$HOST" >> "$GITHUB_OUTPUT"
            echo "Databricks TEST workspace discovered: $HOST"
          else
            echo "host=" >> "$GITHUB_OUTPUT"
            echo "No existing Databricks TEST workspace."
          fi

      - name: Discover TEST SQL Warehouse
        id: warehouse
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ steps.databricks.outputs.host }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
        run: |
          echo "Warehouses visible to CI service principal:"
          databricks warehouses list

          WAREHOUSE_ID=$(databricks warehouses list --output json \
            | jq -r '.[] | select(.name == "sql-northmart-test") | .id' \
            | head -1)

          test -n "$WAREHOUSE_ID" || {
            echo "ERROR: sql-northmart-test not visible to CI principal"
            exit 1
          }

          echo "warehouse_id=$WAREHOUSE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Databricks authentication
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ steps.databricks.outputs.host }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
        run: databricks current-user me

      - name: Validate Databricks bundle
        working-directory: bundles/fraud
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ steps.databricks.outputs.host }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          BUNDLE_VAR_sql_warehouse_id: ${{ steps.warehouse.outputs.warehouse_id }}
        run: |
          databricks bundle validate -t test

      - name: Skip Fraud bundle validation
        if: steps.databricks.outputs.host == ''
        run: |
          echo "Databricks TEST workspace does not currently exist."
          echo "Skipping Databricks bundle validation."