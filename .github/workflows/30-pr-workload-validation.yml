name: Workload PR Validation

on:
  workflow_call:
    inputs:
      workload_path:
        description: "Path to the Databricks workload bundle"
        required: true
        type: string
      databricks_host:
        description: "Databricks TEST workspace URL"
        required: false
        type: string
      warehouse_id:
        description: "Databricks TEST SQL warehouse ID"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ inputs.databricks_host }}
      RESOURCE_GROUP_NAME: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      WORKSPACE_NAME: ${{ vars.TF_VAR_WORKSPACE_NAME }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      # Transitional bootstrap discovery. Replace with the shared discovery
      # workflow in the activation PR once it exists on main.
      - name: Azure login
        if: inputs.databricks_host == ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Discover Databricks TEST resources
        id: discovery
        if: inputs.databricks_host == ''
        shell: bash
        run: |
          HOST=$(az databricks workspace show \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$WORKSPACE_NAME" \
            --query "workspaceUrl" \
            --output tsv)

          if [[ "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi

          export DATABRICKS_HOST="$HOST"
          WAREHOUSE_ID=$(databricks warehouses list --output json \
            | jq -r '.[] | select(.name == "sql-northmart-test") | .id' \
            | head -1)

          test -n "$HOST"
          test -n "$WAREHOUSE_ID"
          echo "DATABRICKS_HOST=$HOST" >> "$GITHUB_ENV"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "warehouse_id=$WAREHOUSE_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Databricks authentication
        run: databricks current-user me

      - name: Validate Databricks bundle
        working-directory: ${{ inputs.workload_path }}
        env:
          DATABRICKS_HOST: ${{ inputs.databricks_host || steps.discovery.outputs.host }}
          BUNDLE_VAR_sql_warehouse_id: ${{ inputs.warehouse_id || steps.discovery.outputs.warehouse_id }}
        run: |
          databricks bundle validate -t test