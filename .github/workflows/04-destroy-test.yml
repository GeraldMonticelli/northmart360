name: Destroy TEST

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY-TEST to destroy the TEST environment"
        required: true
        type: string
      resume_after_bundle:
        description: "Resume after the bundle destroy already succeeded"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: northmart-test
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Verify destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$CONFIRM_DESTROY" != "DESTROY-TEST" ]]; then
            echo "confirm_destroy must equal DESTROY-TEST."
            exit 1
          fi

  discover-test:
    if: ${{ !inputs.resume_after_bundle }}
    needs: validate-confirmation
    uses: GeraldMonticelli/northmart360/.github/workflows/databricks-test-discovery.yml@main
    with:
      release_ref: ${{ github.sha }}
      required: true
    secrets: inherit

  destroy-bundle:
    if: ${{ !inputs.resume_after_bundle }}
    needs: discover-test
    uses: GeraldMonticelli/northmart360/.github/workflows/workload-test.yml@main
    with:
      release_ref: ${{ github.sha }}
      workload_path: bundles/fraud
      databricks_host: ${{ needs.discover-test.outputs.host }}
      warehouse_id: ${{ needs.discover-test.outputs.warehouse_id }}
      operation: destroy
    secrets: inherit

  destroy-infrastructure:
    needs:
      - validate-confirmation
      - discover-test
      - destroy-bundle
    if: >-
      ${{
        always() &&
        needs.validate-confirmation.result == 'success' &&
        (
          inputs.resume_after_bundle ||
          (
            needs.discover-test.result == 'success' &&
            needs.destroy-bundle.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_storage_account_name: ${{ vars.TF_VAR_STORAGE_ACCOUNT_NAME }}
      TF_VAR_key_vault_name: ${{ vars.TF_VAR_KEY_VAULT_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}
      TF_VAR_databricks_managed_resource_group_name: ${{ vars.TF_VAR_DATABRICKS_MANAGED_RESOURCE_GROUP_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.TF_VAR_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
      TF_VAR_fraud_producer_ssh_public_key: ${{ vars.TF_VAR_FRAUD_PRODUCER_SSH_PUBLIC_KEY }}
      TF_VAR_dev_public_ips: ${{ vars.TF_VAR_DEV_PUBLIC_IPS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Discover existing TEST Databricks workspace
        shell: bash
        run: |
          HOST=$(az databricks workspace show \
            --resource-group "${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --name "${{ vars.TF_VAR_WORKSPACE_NAME }}" \
            --query workspaceUrl \
            --output tsv)

          test -n "$HOST" || {
            echo "ERROR: Existing TEST Databricks workspace was not found."
            exit 1
          }

          if [[ "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi

          echo "DATABRICKS_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Remove runtime Unity Catalog objects from TEST
        shell: bash
        run: |
          TOKEN=$(az account get-access-token \
            --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d \
            --query accessToken \
            --output tsv)
          test -n "$TOKEN" || {
            echo "ERROR: Could not obtain a Databricks access token from Azure OIDC."
            exit 1
          }
          echo "::add-mask::$TOKEN"

          API="$DATABRICKS_HOST/api/2.1/unity-catalog"
          AUTH_HEADER="Authorization: Bearer $TOKEN"
          CATALOG="northmart_test"
          CLEANUP_TMP_DIR=$(mktemp -d)
          API_BODY_FILE="$CLEANUP_TMP_DIR/response.json"
          trap 'rm -rf "$CLEANUP_TMP_DIR"' EXIT

          # These names come from the databricks_schema resources in terraform/databricks.tf.
          TERRAFORM_MANAGED_SCHEMAS=(bronze silver ml gold reference sandbox)

          api_request() {
            local method="$1"
            local endpoint="$2"
            local allow_missing="$3"
            shift 3

            local -a curl_args=(
              --silent
              --show-error
              --header "$AUTH_HEADER"
            )
            if [[ "$method" == "GET" ]]; then
              curl_args+=(--get)
            else
              curl_args+=(--request "$method")
            fi
            curl_args+=("$@")
            curl_args+=("$API$endpoint")

            API_STATUS=$(curl "${curl_args[@]}" --output "$API_BODY_FILE" --write-out '%{http_code}')

            if [[ "$API_STATUS" == 2?? ]]; then
              return 0
            fi
            if [[ "$allow_missing" == "true" && "$API_STATUS" == "404" ]]; then
              return 0
            fi

            echo "Databricks request endpoint: $API$endpoint" >&2
            echo "Databricks HTTP status: $API_STATUS" >&2
            echo "Databricks response body:" >&2
            cat "$API_BODY_FILE" >&2
            return 1
          }

          list_uc_objects() {
            local endpoint="$1"
            local response_key="$2"
            local output_file="$3"
            shift 3

            local page_token=""
            local next_page_token
            : > "$output_file"
            while true; do
              local -a query_args=("$@" --data-urlencode "max_results=0")
              if [[ -n "$page_token" ]]; then
                query_args+=(--data-urlencode "page_token=$page_token")
              fi
              api_request GET "$endpoint" false "${query_args[@]}"
              jq -c --arg key "$response_key" '.[$key][]?' "$API_BODY_FILE" >> "$output_file"
              next_page_token=$(jq -r '.next_page_token // empty' "$API_BODY_FILE")
              if [[ -z "$next_page_token" ]]; then
                break
              fi
              page_token="$next_page_token"
            done
          }

          is_terraform_managed_schema() {
            local candidate="$1"
            local managed_schema
            for managed_schema in "${TERRAFORM_MANAGED_SCHEMAS[@]}"; do
              if [[ "$candidate" == "$managed_schema" ]]; then
                return 0
              fi
            done
            return 1
          }

          is_system_schema() {
            [[ "$1" == "information_schema" ]]
          }

          cleanup_collection() {
            local schema_name="$1"
            local endpoint="$2"
            local response_key="$3"
            local default_type="$4"
            local type_field="$5"

            local objects_file="$CLEANUP_TMP_DIR/objects.jsonl"
            list_uc_objects "$endpoint" "$response_key" "$objects_file" \
              --data-urlencode "catalog_name=$CATALOG" \
              --data-urlencode "schema_name=$schema_name" \
              --data-urlencode "include_browse=true"

            while IFS= read -r object; do
              local object_name
              local object_type
              local full_name
              local encoded_name
              [[ -n "$object" ]] || continue
              object_name=$(jq -r '.name // empty' <<< "$object")
              object_type=$(jq -r --arg key "$type_field" \
                --arg fallback "$default_type" '.[$key] // $fallback' <<< "$object")
              if [[ -z "$object_name" ]]; then
                echo "ERROR: Databricks returned a $default_type without a name."
                return 1
              fi

              full_name="$CATALOG.$schema_name.$object_name"
              encoded_name=$(jq -rn --arg name "$full_name" '$name | @uri')
              echo "Discovered Unity Catalog $object_type: $full_name"
              api_request DELETE "$endpoint/$encoded_name" true
              if [[ "$API_STATUS" == "404" ]]; then
                echo "Already absent Unity Catalog $object_type: $full_name"
              else
                echo "Deleted Unity Catalog $object_type: $full_name"
              fi
            done < "$objects_file"
          }

          CURRENT_USER=$(curl --fail --silent --show-error \
            --header "$AUTH_HEADER" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me")
          APPLICATION_ID=$(jq -r '.applicationId // empty' <<< "$CURRENT_USER")
          DISPLAY_NAME=$(jq -r '.displayName // empty' <<< "$CURRENT_USER")
          USER_NAME=$(jq -r '.userName // empty' <<< "$CURRENT_USER")
          USER_ID=$(jq -r '.id // empty' <<< "$CURRENT_USER")

          if [[ -z "$APPLICATION_ID" && -z "$DISPLAY_NAME" && -z "$USER_NAME" && -z "$USER_ID" ]]; then
            echo "ERROR: Databricks did not identify the platform-test OIDC principal."
            exit 1
          fi

          echo "Authenticated Databricks principal: ${DISPLAY_NAME:-$USER_NAME}"

          api_request GET "/catalogs/$CATALOG" true
          if [[ "$API_STATUS" == "404" ]]; then
            echo "Unity Catalog $CATALOG is already absent; skipping cleanup."
            exit 0
          fi

          INITIAL_SCHEMAS_FILE="$CLEANUP_TMP_DIR/initial-schemas.jsonl"
          list_uc_objects "/schemas" "schemas" "$INITIAL_SCHEMAS_FILE" \
            --data-urlencode "catalog_name=$CATALOG" \
            --data-urlencode "include_browse=true"

          while IFS= read -r schema; do
            schema_name=$(jq -r '.name // empty' <<< "$schema")
            [[ -n "$schema_name" ]] || {
              echo "ERROR: Databricks returned a schema without a name."
              exit 1
            }
            echo "Discovered Unity Catalog SCHEMA: $CATALOG.$schema_name"

            if is_system_schema "$schema_name"; then
              echo "Ignoring system Unity Catalog SCHEMA and its contents: $CATALOG.$schema_name"
              continue
            fi

            cleanup_collection "$schema_name" "/tables" "tables" "TABLE" "table_type"
            cleanup_collection "$schema_name" "/volumes" "volumes" "VOLUME" ""
            cleanup_collection "$schema_name" "/functions" "functions" "FUNCTION" ""
            cleanup_collection "$schema_name" "/models" "registered_models" "MODEL" ""

            if ! is_terraform_managed_schema "$schema_name"; then
              encoded_schema=$(jq -rn --arg name "$CATALOG.$schema_name" '$name | @uri')
              echo "Deleting runtime-created Unity Catalog SCHEMA: $CATALOG.$schema_name"
              api_request DELETE "/schemas/$encoded_schema" true
              if [[ "$API_STATUS" == "404" ]]; then
                echo "Already absent Unity Catalog SCHEMA: $CATALOG.$schema_name"
              else
                echo "Deleted runtime-created Unity Catalog SCHEMA: $CATALOG.$schema_name"
              fi
            fi
          done < "$INITIAL_SCHEMAS_FILE"

          echo "Unity Catalog objects remaining before Terraform apply:"
          api_request GET "/catalogs/$CATALOG" false
          echo "REMAINING CATALOG: $CATALOG (Terraform-managed)"

          REMAINING_SCHEMAS_FILE="$CLEANUP_TMP_DIR/remaining-schemas.jsonl"
          list_uc_objects "/schemas" "schemas" "$REMAINING_SCHEMAS_FILE" \
            --data-urlencode "catalog_name=$CATALOG" \
            --data-urlencode "include_browse=true"
          remaining_runtime_objects=0

          while IFS= read -r schema; do
            schema_name=$(jq -r '.name // empty' <<< "$schema")
            full_schema_name="$CATALOG.$schema_name"
            if is_system_schema "$schema_name"; then
              echo "REMAINING SYSTEM SCHEMA: $full_schema_name (excluded from cleanup verification)"
              continue
            fi

            if is_terraform_managed_schema "$schema_name"; then
              echo "REMAINING SCHEMA: $full_schema_name (Terraform-managed)"
            else
              echo "REMAINING SCHEMA: $full_schema_name (unexpected runtime schema)"
              remaining_runtime_objects=$((remaining_runtime_objects + 1))
            fi

            for collection in \
              "tables tables TABLE table_type" \
              "volumes volumes VOLUME -" \
              "functions functions FUNCTION -" \
              "models registered_models MODEL -"; do
              read -r route response_key default_type type_field <<< "$collection"
              remaining_objects_file="$CLEANUP_TMP_DIR/remaining-$route.jsonl"
              if [[ "$type_field" == "-" ]]; then
                type_field=""
              fi
              list_uc_objects "/$route" "$response_key" "$remaining_objects_file" \
                --data-urlencode "catalog_name=$CATALOG" \
                --data-urlencode "schema_name=$schema_name" \
                --data-urlencode "include_browse=true"
              while IFS= read -r object; do
                [[ -n "$object" ]] || continue
                object_name=$(jq -r '.name // empty' <<< "$object")
                object_type=$(jq -r --arg key "$type_field" \
                  --arg fallback "$default_type" \
                  'if $key == "" then $fallback else (.[$key] // $fallback) end' \
                  <<< "$object")
                echo "REMAINING Unity Catalog $object_type: $CATALOG.$schema_name.$object_name"
                remaining_runtime_objects=$((remaining_runtime_objects + 1))
              done < "$remaining_objects_file"
            done
          done < "$REMAINING_SCHEMAS_FILE"

          if [[ "$remaining_runtime_objects" -ne 0 ]]; then
            echo "ERROR: $remaining_runtime_objects non-Terraform Unity Catalog object(s) remain."
            exit 1
          fi

          for managed_schema in "${TERRAFORM_MANAGED_SCHEMAS[@]}"; do
            if ! jq -s -e --arg name "$managed_schema" \
              'any(.[]; .name == $name)' "$REMAINING_SCHEMAS_FILE" >/dev/null; then
              echo "Managed schema is absent and will not be recreated: $CATALOG.$managed_schema"
            fi
          done

      - name: Force-delete TEST external location
        shell: bash
        run: |
          TOKEN=$(az account get-access-token \
            --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d \
            --query accessToken \
            --output tsv)
          test -n "$TOKEN" || {
            echo "ERROR: Could not obtain a Databricks access token from Azure OIDC."
            exit 1
          }
          echo "::add-mask::$TOKEN"

          ENDPOINT="$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations/el_northmart_test?force=true"
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS=$(curl --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $TOKEN" \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            "$ENDPOINT")

          if [[ "$HTTP_STATUS" == 2?? ]]; then
            echo "Force-deleted TEST external location: el_northmart_test"
          elif [[ "$HTTP_STATUS" == "404" ]]; then
            echo "TEST external location el_northmart_test is already absent."
          else
            echo "Databricks request endpoint: $ENDPOINT" >&2
            echo "Databricks HTTP status: $HTTP_STATUS" >&2
            echo "Databricks response body:" >&2
            cat "$RESPONSE_FILE" >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init TEST
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform Destroy Plan TEST
        working-directory: terraform
        run: |
          terraform plan \
            -destroy \
            -out=test-destroy.tfplan

      - name: Display saved destroy plan
        working-directory: terraform
        run: terraform show -no-color test-destroy.tfplan

      - name: Apply saved destroy plan
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            test-destroy.tfplan