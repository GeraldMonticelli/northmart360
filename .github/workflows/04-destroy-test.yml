name: Destroy TEST

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY-TEST to destroy the TEST environment"
        required: true
        type: string
      resume_after_bundle:
        description: "Resume after the bundle destroy already succeeded"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: northmart-test
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Verify destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$CONFIRM_DESTROY" != "DESTROY-TEST" ]]; then
            echo "confirm_destroy must equal DESTROY-TEST."
            exit 1
          fi

  discover-test:
    if: ${{ !inputs.resume_after_bundle }}
    needs: validate-confirmation
    uses: GeraldMonticelli/northmart360/.github/workflows/databricks-test-discovery.yml@main
    with:
      release_ref: ${{ github.sha }}
      required: true
    secrets: inherit

  destroy-bundle:
    if: ${{ !inputs.resume_after_bundle }}
    needs: discover-test
    uses: GeraldMonticelli/northmart360/.github/workflows/workload-test.yml@main
    with:
      release_ref: ${{ github.sha }}
      workload_path: bundles/fraud
      databricks_host: ${{ needs.discover-test.outputs.host }}
      warehouse_id: ${{ needs.discover-test.outputs.warehouse_id }}
      operation: destroy
    secrets: inherit

  destroy-infrastructure:
    needs:
      - validate-confirmation
      - discover-test
      - destroy-bundle
    if: >-
      ${{
        always() &&
        needs.validate-confirmation.result == 'success' &&
        (
          inputs.resume_after_bundle ||
          (
            needs.discover-test.result == 'success' &&
            needs.destroy-bundle.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_storage_account_name: ${{ vars.TF_VAR_STORAGE_ACCOUNT_NAME }}
      TF_VAR_key_vault_name: ${{ vars.TF_VAR_KEY_VAULT_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}
      TF_VAR_databricks_managed_resource_group_name: ${{ vars.TF_VAR_DATABRICKS_MANAGED_RESOURCE_GROUP_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.TF_VAR_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
      TF_VAR_fraud_producer_ssh_public_key: ${{ vars.TF_VAR_FRAUD_PRODUCER_SSH_PUBLIC_KEY }}
      TF_VAR_dev_public_ips: ${{ vars.TF_VAR_DEV_PUBLIC_IPS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Discover existing TEST Databricks workspace
        shell: bash
        run: |
          HOST=$(az databricks workspace show \
            --resource-group "${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --name "${{ vars.TF_VAR_WORKSPACE_NAME }}" \
            --query workspaceUrl \
            --output tsv)

          test -n "$HOST" || {
            echo "ERROR: Existing TEST Databricks workspace was not found."
            exit 1
          }

          if [[ "$HOST" != https://* ]]; then
            HOST="https://$HOST"
          fi

          echo "DATABRICKS_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Remove the remaining TEST silver table
        shell: bash
        run: |
          TOKEN=$(az account get-access-token \
            --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d \
            --query accessToken \
            --output tsv)
          test -n "$TOKEN" || {
            echo "ERROR: Could not obtain a Databricks access token from Azure OIDC."
            exit 1
          }
          echo "::add-mask::$TOKEN"

          API="$DATABRICKS_HOST/api/2.1/unity-catalog"
          AUTH_HEADER="Authorization: Bearer $TOKEN"

          CURRENT_USER=$(curl --fail --silent --show-error \
            --header "$AUTH_HEADER" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me")
          APPLICATION_ID=$(jq -r '.applicationId // empty' <<< "$CURRENT_USER")
          DISPLAY_NAME=$(jq -r '.displayName // empty' <<< "$CURRENT_USER")
          USER_NAME=$(jq -r '.userName // empty' <<< "$CURRENT_USER")
          USER_ID=$(jq -r '.id // empty' <<< "$CURRENT_USER")

          if [[ -z "$APPLICATION_ID" && -z "$DISPLAY_NAME" && -z "$USER_NAME" && -z "$USER_ID" ]]; then
            echo "ERROR: Databricks did not identify the platform-test OIDC principal."
            exit 1
          fi

          echo "Authenticated Databricks principal: ${DISPLAY_NAME:-$USER_NAME}"

          SCHEMA_ENDPOINT="$API/schemas/northmart_test.silver"
          SCHEMA_RESPONSE=$(curl --silent --show-error \
            --write-out $'\n%{http_code}' \
            --header "$AUTH_HEADER" \
            "$SCHEMA_ENDPOINT")
          SCHEMA_STATUS="${SCHEMA_RESPONSE##*$'\n'}"
          SCHEMA="${SCHEMA_RESPONSE%$'\n'*}"
          echo "Databricks request endpoint: $SCHEMA_ENDPOINT"
          echo "Databricks HTTP status: $SCHEMA_STATUS"
          echo "Databricks response body:"
          printf '%s\n' "$SCHEMA"
          if [[ "$SCHEMA_STATUS" != 2?? ]]; then
            exit 1
          fi

          SCHEMA_OWNER=$(jq -r '.owner // empty' <<< "$SCHEMA")
          PERMISSIONS_ENDPOINT="$API/permissions/schemas/northmart_test.silver"
          PERMISSIONS_RESPONSE=$(curl --silent --show-error \
            --write-out $'\n%{http_code}' \
            --header "$AUTH_HEADER" \
            "$PERMISSIONS_ENDPOINT")
          PERMISSIONS_STATUS="${PERMISSIONS_RESPONSE##*$'\n'}"
          SCHEMA_PERMISSIONS="${PERMISSIONS_RESPONSE%$'\n'*}"
          echo "Databricks request endpoint: $PERMISSIONS_ENDPOINT"
          echo "Databricks HTTP status: $PERMISSIONS_STATUS"
          echo "Databricks response body:"
          printf '%s\n' "$SCHEMA_PERMISSIONS"
          if [[ "$PERMISSIONS_STATUS" != 2?? ]]; then
            exit 1
          fi

          SCHEMA_PRIVILEGES=$(jq -r \
            --arg application_id "$APPLICATION_ID" \
            --arg display_name "$DISPLAY_NAME" \
            --arg user_name "$USER_NAME" \
            --arg user_id "$USER_ID" \
            '[.privilege_assignments[]?
              | select(
                  (.principal | ascii_downcase) == ($application_id | ascii_downcase) or
                  (.principal | ascii_downcase) == ($display_name | ascii_downcase) or
                  (.principal | ascii_downcase) == ($user_name | ascii_downcase) or
                  (.principal | ascii_downcase) == ($user_id | ascii_downcase)
                )
              | .privileges[]?
              | if type == "object" then .privilege else . end]
             | unique
             | join(",")' \
            <<< "$SCHEMA_PERMISSIONS")
          echo "Schema owner: ${SCHEMA_OWNER:-unknown}"
          echo "Direct/inherited schema privileges for the authenticated principal: ${SCHEMA_PRIVILEGES:-none}"

          TABLES=$(curl --fail --silent --show-error --get \
            --header "$AUTH_HEADER" \
            --data-urlencode "catalog_name=northmart_test" \
            --data-urlencode "schema_name=silver" \
            --data-urlencode "max_results=100" \
            "$API/tables")

          NEXT_PAGE=$(jq -r '.next_page_token // empty' <<< "$TABLES")
          TABLE_COUNT=$(jq '.tables | length' <<< "$TABLES")
          if [[ -n "$NEXT_PAGE" || "$TABLE_COUNT" -ne 1 ]]; then
            echo "ERROR: Expected exactly the one remaining silver table from the failed Terraform run."
            echo "Found $TABLE_COUNT table(s); refusing cleanup."
            exit 1
          fi

          TABLE_NAME=$(jq -r '.tables[0].name // empty' <<< "$TABLES")
          TABLE_TYPE=$(jq -r '.tables[0].table_type // empty' <<< "$TABLES")
          FULL_NAME="northmart_test.silver.$TABLE_NAME"
          if [[ -z "$TABLE_NAME" || ( "$TABLE_TYPE" != "MANAGED" && "$TABLE_TYPE" != "EXTERNAL" ) ]]; then
            echo "ERROR: The remaining object is not a supported managed or external table."
            exit 1
          fi

          ENCODED_FULL_NAME=$(jq -rn --arg name "$FULL_NAME" '$name | @uri')
          TABLE=$(curl --fail --silent --show-error \
            --header "$AUTH_HEADER" \
            "$API/tables/$ENCODED_FULL_NAME")
          TABLE_OWNER=$(jq -r '.owner // empty' <<< "$TABLE")

          OWNER_MATCH=$(jq -r \
            --arg owner "$TABLE_OWNER" \
            --arg application_id "$APPLICATION_ID" \
            --arg display_name "$DISPLAY_NAME" \
            --arg user_name "$USER_NAME" \
            --arg user_id "$USER_ID" \
            '[$application_id, $display_name, $user_name, $user_id]
             | map(select(length > 0))
             | any(.[]; ascii_downcase == ($owner | ascii_downcase))' \
            <<< "$CURRENT_USER")

          HAS_MANAGE=false
          if [[ "$OWNER_MATCH" != "true" ]]; then
            TABLE_PERMISSIONS=$(curl --fail --silent --show-error \
              --header "$AUTH_HEADER" \
              "$API/permissions/tables/$ENCODED_FULL_NAME")
            HAS_MANAGE=$(jq -r \
              --arg application_id "$APPLICATION_ID" \
              --arg display_name "$DISPLAY_NAME" \
              --arg user_name "$USER_NAME" \
              --arg user_id "$USER_ID" \
              '[.privilege_assignments[]?
                | select(
                    (.principal | ascii_downcase) == ($application_id | ascii_downcase) or
                    (.principal | ascii_downcase) == ($display_name | ascii_downcase) or
                    (.principal | ascii_downcase) == ($user_name | ascii_downcase) or
                    (.principal | ascii_downcase) == ($user_id | ascii_downcase)
                  )
                | .privileges[]?
                | if type == "object" then .privilege else . end
                | select(. == "MANAGE")]
               | length > 0' \
              <<< "$TABLE_PERMISSIONS")
          fi

          if [[ "$OWNER_MATCH" != "true" && "$HAS_MANAGE" != "true" ]]; then
            echo "ERROR: The platform-test principal is neither the table owner nor explicitly granted MANAGE."
            echo "Schema owner reported by Databricks: ${SCHEMA_OWNER:-unknown}"
            echo "Table owner reported by Databricks: ${TABLE_OWNER:-unknown}"
            echo "No object was deleted."
            exit 1
          fi

          echo "Deleting only $FULL_NAME ($TABLE_TYPE)."
          curl --fail --silent --show-error \
            --request DELETE \
            --header "$AUTH_HEADER" \
            "$API/tables/$ENCODED_FULL_NAME"

          REMAINING_TABLES=$(curl --fail --silent --show-error --get \
            --header "$AUTH_HEADER" \
            --data-urlencode "catalog_name=northmart_test" \
            --data-urlencode "schema_name=silver" \
            --data-urlencode "max_results=100" \
            "$API/tables")
          if [[ "$(jq '.tables | length' <<< "$REMAINING_TABLES")" -ne 0 ]]; then
            echo "ERROR: A table remains in northmart_test.silver after cleanup."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init TEST
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform Destroy Plan TEST
        working-directory: terraform
        run: |
          terraform plan \
            -destroy \
            -out=test-destroy.tfplan

      - name: Display saved destroy plan
        working-directory: terraform
        run: terraform show -no-color test-destroy.tfplan

      - name: Apply saved destroy plan
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            test-destroy.tfplan