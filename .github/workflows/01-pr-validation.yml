name: 01 - PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform
  TF_VERSION: "1.15.8"

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    environment: platform-test

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan TEST
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file=test.tfvars \
            -out=tfplan

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
  
      - name: Discover Databricks host
        id: databricks
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          HOST=$($(az databricks workspace show \
            --resource-group "${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}" \
            --name "${{ vars.TF_VAR_WORKSPACE_NAME }}" \
            --query workspaceUrl \
            -o tsv 2>/dev/null || true)

          if [ -n "$HOST" ]; then
            if [[ "$HOST" != https://* ]]; then
              HOST="https://$HOST"
            fi

            echo "host=$HOST" >> "$GITHUB_OUTPUT"
            echo "Databricks TEST workspace discovered."
          else
            echo "host=" >> "$GITHUB_OUTPUT"
            echo "No existing Databricks TEST workspace. Bundle validation will be skipped."
          fi

      - name: Validate Databricks bundle
        if: steps.databricks.outputs.host != ''
        working-directory: bundles/fraud
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ steps.databricks.outputs.host }}
          DATABRICKS_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          databricks bundle validate -t test

      - name: Skip Fraud bundle validation
        if: steps.databricks.outputs.host == ''
        run: |
          echo "Databricks TEST workspace does not currently exist."
          echo "Skipping Databricks bundle validation."
