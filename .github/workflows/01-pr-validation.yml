name: 01 - PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform
  TF_VERSION: "1.15.8"

jobs:

  # ============================================================
  # Detect which parts of the repository changed
  # ============================================================

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest

    outputs:
      fraud: ${{ steps.filter.outputs.fraud }}
      terraform: ${{ steps.filter.outputs.terraform }}
      terraform_shared: ${{ steps.filter.outputs.terraform_shared }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fraud:
              - 'bundles/fraud/**'
            terraform:
              - 'terraform/**'
              - '!terraform/shared/**'
            terraform_shared:
              - 'terraform/shared/**'
              
      - name: Show detected paths
        run: |
          echo "fraud=${{ steps.filter.outputs.fraud }}"
          echo "fraud files=${{ steps.filter.outputs.fraud_files }}"
          echo "terraform=${{ steps.filter.outputs.terraform }}"
          echo "terraform files=${{ steps.filter.outputs.terraform_files }}"
          echo "terraform_shared=${{ steps.filter.outputs.terraform_shared }}"
          echo "shared files=${{ steps.filter.outputs.terraform_shared_files }}"

  # ============================================================
  # Fraud workload validation
  # ============================================================

  fraud-validation:
    name: Fraud validation
    needs: changes
    if: needs.changes.outputs.fraud == 'true'
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install Python CI dependencies
        working-directory: bundles/fraud
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ruff \
            pytest \
            pytest-cov \
            checkov \
            databricks-connect

      - name: Ruff
        working-directory: bundles/fraud
        run: |
          ruff check src tests

      - name: Pytest with coverage
        working-directory: bundles/fraud
        run: |
          python -m pytest tests/unit \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Publish Python coverage
        working-directory: bundles/fraud
        run: |
          {
            echo "## Python Unit Test Coverage"
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Discover Databricks host
        id: databricks
        shell: bash
        run: |
          HOST=$(az databricks workspace show \
            --resource-group "$TF_VAR_resource_group_name" \
            --name "$TF_VAR_workspace_name" \
            --query "workspaceUrl" \
            --output tsv 2>/dev/null || true)

          if [ -n "$HOST" ]; then
            if [[ "$HOST" != https://* ]]; then
              HOST="https://$HOST"
            fi

            echo "host=$HOST" >> "$GITHUB_OUTPUT"
            echo "Databricks TEST workspace discovered: $HOST"
          else
            echo "host=" >> "$GITHUB_OUTPUT"
            echo "No existing Databricks TEST workspace."
          fi

      - name: Validate Databricks bundle
        if: steps.databricks.outputs.host != ''
        working-directory: bundles/fraud
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ steps.databricks.outputs.host }}
          DATABRICKS_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          databricks bundle validate -t test

      - name: Skip Fraud bundle validation
        if: steps.databricks.outputs.host == ''
        run: |
          echo "Databricks TEST workspace does not currently exist."
          echo "Skipping Databricks bundle validation."


  # ============================================================
  # Terraform platform validation
  # ============================================================

  terraform-validation:
    name: Terraform validation
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_storage_account_name: ${{ vars.TF_VAR_STORAGE_ACCOUNT_NAME }}
      TF_VAR_key_vault_name: ${{ vars.TF_VAR_KEY_VAULT_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}
      TF_VAR_databricks_managed_resource_group_name: ${{ vars.TF_VAR_DATABRICKS_MANAGED_RESOURCE_GROUP_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.TF_VAR_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
      TF_VAR_fraud_producer_ssh_public_key: ${{ vars.TF_VAR_FRAUD_PRODUCER_SSH_PUBLIC_KEY }}
      TF_VAR_dev_public_ips: ${{ vars.TF_VAR_DEV_PUBLIC_IPS }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform format
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: TFLint
        working-directory: ${{ env.TF_DIR }}
        run: |
          tflint --init
          tflint --recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov==3.3.17
      
      # shared already has it own checkov scan, so we skip it here to avoid duplicate findings
      - name: Checkov IaC security scan
        run: |
          checkov \
            -d . \
            --framework terraform \
            --compact \
            --skip-path shared

      - name: Terraform plan TEST
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform plan summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "## Terraform Plan — TEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ============================================================
  # Terraform shared validation
  # ============================================================

  terraform-shared-validation:
    name: Terraform Shared validation
    needs: changes
    if: needs.changes.outputs.terraform_shared == 'true'
    runs-on: ubuntu-latest
    environment: platform-shared

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init Shared
        working-directory: terraform/shared
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=northmart-shared.tfstate"

      - name: Terraform format
        working-directory: terraform/shared
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: TFLint
        working-directory: terraform/shared
        run: |
          tflint --init
          tflint --recursive

      - name: Terraform validate
        working-directory: terraform/shared
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov==3.3.17

      - name: Checkov IaC security scan
        run: |
          checkov \
            -d terraform/shared \
            --framework terraform \
            --compact

      - name: Terraform plan Shared
        working-directory: terraform/shared
        run: |
          terraform plan \
            -input=false \
            -out=shared.tfplan

      - name: Terraform plan summary
        working-directory: terraform/shared
        run: |
          echo "## Terraform Plan — SHARED" >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color shared.tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"