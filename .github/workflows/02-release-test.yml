name: Release Test

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git tag or commit to deploy to TEST"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    name: Detect release changes
    runs-on: ubuntu-latest

    outputs:
      terraform_shared: ${{ steps.changes.outputs.terraform_shared }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shared Terraform changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CURRENT_TAG="${GITHUB_REF_NAME}"
          else
            CURRENT_TAG="${{ inputs.release_ref }}"
          fi
          
          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep -Fxv "$CURRENT_TAG" \
            | head -n 1)

          echo "Current release:  $CURRENT_TAG"
          echo "Previous release: $PREVIOUS_TAG"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "terraform_shared=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREVIOUS_TAG" "$CURRENT_TAG" -- terraform/shared; then
            echo "terraform_shared=false" >> "$GITHUB_OUTPUT"
          else
            echo "terraform_shared=true" >> "$GITHUB_OUTPUT"
          fi

  platform-shared:
    name: Deploy Shared Platform
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform_shared == 'true'
    uses: ./.github/workflows/platform-shared.yml
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
    secrets: inherit

  platform-test:
    name: Deploy TEST Platform
    needs:
      - detect-changes
      - platform-shared
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.platform-shared.result == 'success' ||
       needs.platform-shared.result == 'skipped')
    uses: ./.github/workflows/platform-test.yml
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
    secrets: inherit

  databricks-test-discovery:
    name: Discover TEST Databricks resources
    needs: platform-test
    if: |
      always() &&
      needs.platform-test.result == 'success'
    uses: GeraldMonticelli/northmart360/.github/workflows/databricks-test-discovery.yml@main
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
      required: true
    secrets: inherit

  workload-test:
    name: Deploy TEST Workload
    needs: databricks-test-discovery
    if: |
      always() &&
      needs.databricks-test-discovery.result == 'success'
    uses: GeraldMonticelli/northmart360/.github/workflows/workload-test.yml@main
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
      workload_path: bundles/fraud
      databricks_host: ${{ needs.databricks-test-discovery.outputs.host }}
      warehouse_id: ${{ needs.databricks-test-discovery.outputs.warehouse_id }}
    secrets: inherit

  release-validation:
    name: Validate TEST Release
    needs:
      - databricks-test-discovery
      - workload-test
    if: |
      always() &&
      needs.databricks-test-discovery.result == 'success' &&
      needs.workload-test.result == 'success'
    uses: GeraldMonticelli/northmart360/.github/workflows/release-validation-test.yml@main
    with:
      release_ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
      databricks_host: ${{ needs.databricks-test-discovery.outputs.host }}
      warehouse_id: ${{ needs.databricks-test-discovery.outputs.warehouse_id }}
    secrets: inherit