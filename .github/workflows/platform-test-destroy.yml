name: Destroy TEST Platform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy-test:
    name: Destroy TEST Infrastructure
    runs-on: ubuntu-latest
    environment: platform-test

    env:
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_storage_account_name: ${{ vars.TF_VAR_STORAGE_ACCOUNT_NAME }}
      TF_VAR_key_vault_name: ${{ vars.TF_VAR_KEY_VAULT_NAME }}
      TF_VAR_workspace_name: ${{ vars.TF_VAR_WORKSPACE_NAME }}
      TF_VAR_databricks_managed_resource_group_name: ${{ vars.TF_VAR_DATABRICKS_MANAGED_RESOURCE_GROUP_NAME }}
      TF_VAR_sql_admin_login: ${{ vars.TF_VAR_SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_password: ${{ secrets.TF_VAR_SQL_ADMIN_PASSWORD }}
      TF_VAR_fraud_producer_ssh_public_key: ${{ vars.TF_VAR_FRAUD_PRODUCER_SSH_PUBLIC_KEY }}
      TF_VAR_dev_public_ips: ${{ vars.TF_VAR_DEV_PUBLIC_IPS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
      # ------------------------------------------------------------
      # Databricks CLI
      # ------------------------------------------------------------

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Test Databricks authentication
        run: |
          echo "Authenticating against: $DATABRICKS_HOST"
          databricks current-user me

      - name: List remaining TEST schemas
        run: |
         echo "=== Remaining schemas in northmart_test ==="
         databricks schemas list northmart_test

      - name: Delete non-Terraform DBT schema
        run: |
          echo "Deleting northmart_test.dbt and all its contents..."
          databricks schemas delete northmart_test.dbt --force

      - name: Verify remaining TEST schemas
        run: |
          echo "=== Schemas after cleanup ==="
          databricks schemas list northmart_test

      # ------------------------------------------------------------
      #  Terraform destroy
      # ------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init TEST
        working-directory: terraform
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Destroy Plan
        working-directory: terraform
        run: |
          terraform plan \
            -destroy \
            -out=tf-destroy-plan

      - name: Terraform Destroy
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            tf-destroy-plan