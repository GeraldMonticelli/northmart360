name: Fraud PR Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Fraud validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install Python CI dependencies
        working-directory: bundles/fraud
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ruff \
            pytest \
            pytest-cov \
            checkov \
            databricks-connect

      - name: Ruff
        working-directory: bundles/fraud
        run: |
          ruff check src tests

      - name: Pytest with coverage
        working-directory: bundles/fraud
        run: |
          python -m pytest tests/unit \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Publish Python coverage
        working-directory: bundles/fraud
        run: |
          {
            echo "## Python Unit Test Coverage"
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"