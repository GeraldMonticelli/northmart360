name: 02 - Deploy TEST

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: northmart-test
  cancel-in-progress: false

env:
  TF_DIR: platform/terraform
  TF_VERSION: "1.15.8"

jobs:
  deploy:
    name: Deploy exact commit to TEST
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Display release
        run: |
          echo "Deploying TEST release:"
          echo "${{ github.sha }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init TEST
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="key=northmart-test.tfstate"

      - name: Terraform plan TEST
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file=test.tfvars \
            -out=tfplan

      - name: Terraform apply TEST
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle TEST
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_TEST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
        run: databricks bundle validate -t test

      - name: Deploy bundle TEST
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_TEST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
        run: databricks bundle deploy -t test

      - name: Release summary
        run: |
          echo "TEST deployed successfully"
          echo "Release SHA=${{ github.sha }}"