name: Workload Test

on:
  workflow_call:
    inputs:
      release_ref:
        description: "Git tag or commit to deploy"
        required: true
        type: string
      databricks_host:
        description: "Databricks TEST workspace URL"
        required: true
        type: string
      warehouse_id:
        description: "Databricks TEST SQL warehouse ID"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git tag or commit to deploy"
        required: true
        type: string
      databricks_host:
        description: "Databricks TEST workspace URL"
        required: true
        type: string
      warehouse_id:
        description: "Databricks TEST SQL warehouse ID"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  databricks-test:
    runs-on: ubuntu-latest
    environment: workload-test

    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ inputs.databricks_host }}
      BUNDLE_VAR_sql_warehouse_id: ${{ inputs.warehouse_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Show release
        run: |
          echo "Requested release: ${{ inputs.release_ref }}"
          echo "Actual commit:"
          git rev-parse HEAD
          git log -1 --oneline
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Test Databricks authentication
        run: |
          echo "Authenticating against: $DATABRICKS_HOST"
          databricks current-user me

      - name: Deploy Databricks bundle
        working-directory: bundles/fraud
        run: databricks bundle deploy -t test
