name: 00 - PR Validation

# ============================================================
# NORTHMART PR VALIDATION ORCHESTRATOR
#
# This is the ONLY workflow directly triggered by pull requests.
#
# Responsibilities:
#   1. Detect which repository areas changed in the complete PR.
#   2. Run every applicable validation independently.
#   3. Allow a PR to span multiple repository areas.
#   4. Delegate privileged validation to trusted workflows on main.
#   5. Aggregate all results into one stable status check.
#
# GitHub Ruleset requires ONLY:
#   "PR Validation Gate"
#
# Privileged Azure/Databricks validation is delegated to reusable
# workflows pinned to @main. This keeps the privileged validator
# trusted and provides a stable OIDC job_workflow_ref.
# ============================================================

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ==========================================================
  # 1. Detect repository areas modified by the PR
  # ==========================================================
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest

    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      fraud: ${{ steps.filter.outputs.fraud }}
      terraform: ${{ steps.filter.outputs.terraform }}
      terraform_shared: ${{ steps.filter.outputs.terraform_shared }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'

            fraud:
              - 'bundles/fraud/**'

            terraform:
              - 'terraform/**'
              - '!terraform/shared/**'

            terraform_shared:
              - 'terraform/shared/**'

      - name: Show detected paths
        run: |
          echo "workflows=${{ steps.filter.outputs.workflows }}"
          echo "fraud=${{ steps.filter.outputs.fraud }}"
          echo "terraform=${{ steps.filter.outputs.terraform }}"
          echo "terraform_shared=${{ steps.filter.outputs.terraform_shared }}"

  # ==========================================================
  # 2A. GitHub workflow validation
  #
  # Runs whenever .github/workflows/** is modified.
  # ==========================================================
  workflow-validation:
    name: Workflow validation
    needs:
      - changes

    if: needs.changes.outputs.workflows == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/10-pr-workflow-validation.yml@main
    secrets: inherit

  # ==========================================================
  # 2B. Fraud Python validation
  #
  # Runs whenever bundles/fraud/** is modified.
  # ==========================================================
  fraud-validation:
    name: Fraud validation
    needs:
      - changes

    if: needs.changes.outputs.fraud == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/20-pr-fraud-validation.yml@main
    secrets: inherit

  # ==========================================================
  # 2C. Databricks TEST discovery
  #
  # Runs whenever bundles/fraud/** is modified.
  #
  # IMPORTANT:
  # This trusted reusable remains pinned to @main.
  # Its stable workflow identity is used by the Databricks
  # federation policy through job_workflow_ref.
  # ==========================================================
  databricks-test-discovery:
    name: Databricks TEST discovery
    needs:
      - changes

    if: needs.changes.outputs.fraud == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/databricks-test-discovery.yml@main
    secrets: inherit

  # ==========================================================
  # 2D. Databricks bundle validation
  #
  # Runs whenever bundles/fraud/** is modified.
  # ==========================================================
  fraud-bundle-validation:
    name: Fraud bundle validation
    needs:
      - changes
      - databricks-test-discovery

    if: needs.changes.outputs.fraud == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/30-pr-workload-validation.yml@main
    with:
      databricks_host: ${{ needs.databricks-test-discovery.outputs.host }}
      warehouse_id: ${{ needs.databricks-test-discovery.outputs.warehouse_id }}
    secrets: inherit

  # ==========================================================
  # 2E. Terraform TEST validation
  #
  # Runs whenever terraform/** except terraform/shared/**
  # is modified.
  # ==========================================================
  terraform-validation:
    name: Terraform validation
    needs:
      - changes

    if: needs.changes.outputs.terraform == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/40-pr-terraform-validation.yml@main
    secrets: inherit

  # ==========================================================
  # 2F. Terraform SHARED validation
  #
  # Runs whenever terraform/shared/** is modified.
  # ==========================================================
  terraform-shared-validation:
    name: Terraform Shared validation
    needs:
      - changes

    if: needs.changes.outputs.terraform_shared == 'true'

    uses: GeraldMonticelli/northmart360/.github/workflows/41-pr-terraform-shared-validation.yml@main
    secrets: inherit

  # ==========================================================
  # 3. Secret scanning
  #
  # Runs for EVERY PR.
  # ==========================================================
  secret-scanning:
    name: Secret scanning

    uses: GeraldMonticelli/northmart360/.github/workflows/50-pr-secret-validation.yml@main
    secrets: inherit

  # ==========================================================
  # 4. Universal PR gate
  #
  # This job ALWAYS runs.
  #
  # Specialized validations may legitimately be skipped when
  # their repository area was not modified.
  #
  # success + skipped = acceptable
  # failure + cancelled = PR blocked
  #
  # This is the ONLY status check required by the main ruleset.
  # ==========================================================
  pr-validation-gate:
    name: PR Validation Gate
    if: always()

    needs:
      - changes
      - workflow-validation
      - fraud-validation
      - databricks-test-discovery
      - fraud-bundle-validation
      - terraform-validation
      - terraform-shared-validation
      - secret-scanning

    runs-on: ubuntu-latest

    steps:
      - name: Verify validation results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          WORKFLOW: ${{ needs.workflow-validation.result }}
          FRAUD: ${{ needs.fraud-validation.result }}
          DATABRICKS_DISCOVERY: ${{ needs.databricks-test-discovery.result }}
          FRAUD_BUNDLE: ${{ needs.fraud-bundle-validation.result }}
          TERRAFORM: ${{ needs.terraform-validation.result }}
          TERRAFORM_SHARED: ${{ needs.terraform-shared-validation.result }}
          SECRETS: ${{ needs.secret-scanning.result }}

        run: |
          echo "changes=$CHANGES"
          echo "workflow=$WORKFLOW"
          echo "fraud=$FRAUD"
          echo "databricks_discovery=$DATABRICKS_DISCOVERY"
          echo "fraud_bundle=$FRAUD_BUNDLE"
          echo "terraform=$TERRAFORM"
          echo "terraform_shared=$TERRAFORM_SHARED"
          echo "secrets=$SECRETS"

          for RESULT in \
            "$CHANGES" \
            "$WORKFLOW" \
            "$FRAUD" \
            "$DATABRICKS_DISCOVERY" \
            "$FRAUD_BUNDLE" \
            "$TERRAFORM" \
            "$TERRAFORM_SHARED" \
            "$SECRETS"
          do
            case "$RESULT" in
              success|skipped)
                ;;
              *)
                echo "ERROR: validation result=$RESULT"
                exit 1
                ;;
            esac
          done

          echo "PR validation succeeded."